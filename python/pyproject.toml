[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securekit"
version = "0.1.0"
description = "Thin, opinionated field encryption, blind indexes, record seals, request signing and Argon2id passwords."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prabhas9192" }]
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0,<2.1"]  # tested on 2.0.55

[tool.setuptools]
packages = ["securekit"]
